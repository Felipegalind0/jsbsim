name: Verify locked JSBSim SDK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "bindings/**"
      - "scripts/**"
      - "cmake/**"
      - "test/**"
      - "sources/**"
      - "*-lock.json"
      - "*.lock.json"
      - "package.json"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
      - name: Install pinned packaging tools
        run: |
          npm install --global npm@11.19.1
          python -m pip install cmake==4.4.3
      - run: npm ci
      - run: npm run test:source
      - run: npm run build
      - run: npm run pack:build -- --release
      - uses: actions/upload-artifact@v4
        with:
          name: identified-sdk
          path: build/artifacts/
