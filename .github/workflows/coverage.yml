name: Code coverage

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - "**/*.md"
      - "joss_paper/**"
      - "**/*.ipynb"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "joss_paper/**"
      - "**/*.ipynb"

jobs:
  Codecov:
    name: Code coverage
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      CODECOV_CONFIGURED: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install cxxtest lcov
      - name: Checkout JSBSim
        uses: actions/checkout@v7
      - name: Configure JSBSim
        run: |
          mkdir build && cd build
          cmake -DENABLE_COVERAGE=ON -DBUILD_PYTHON_MODULE=OFF -DBUILD_DOCS=OFF ..
      - name: Build JSBSim
        working-directory: build
        run: make --jobs=$(nproc)
      - name: Run JSBSim tests
        working-directory: build
        run: ctest -R Test1 --output-on-failure
      - name: Generate coverage report
        working-directory: build
        run: make lcov
      - name: Preserve generated coverage report
        uses: actions/upload-artifact@v7
        with:
          name: native-coverage
          path: ./build/lcov/data/capture/all_targets.info
          if-no-files-found: error
      - name: Report unconfigured fork upload
        if: github.repository != 'JSBSim-Team/jsbsim' && env.CODECOV_CONFIGURED != 'true'
        run: echo "Coverage tests and report generation completed. Codecov upload is not configured for this fork; the native-coverage artifact contains the report." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov
        if: github.repository == 'JSBSim-Team/jsbsim' || env.CODECOV_CONFIGURED == 'true'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./build/lcov/data/capture/all_targets.info
          disable_search: true
          fail_ci_if_error: true
